name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  python-compatibility:
    name: Python 3.13 syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Compile integration modules
        run: python -m compileall -q custom_components/smappee_ev

  pytest:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The pinned Home Assistant test dependencies require Python >=3.14.2.
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements-test.txt

      - name: Create virtual environment
        run: |
          uv venv --python 3.14

      - name: Install test dependencies
        run: |
          uv pip install -r requirements-test.txt

      - name: Run tests with coverage
        run: |
          uv run pytest -vv \
            --cov=custom_components.smappee_ev \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=95

  mqtt-transport:
    name: Real MQTT transport
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install real MQTT dependencies
        run: python -m pip install -r requirements-mqtt-test.txt
      - name: Run broker smoke test
        run: python -m unittest discover -s mqtt_smoke -v
