name: Zip Release

on:
  release:
    types:
      - published

jobs:
  release:
    name: Release Smappee EV
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}

      - name: Validate version and build the release package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python script/build_release.py --tag "$RELEASE_TAG" --output dist/smappee_ev.zip

      - name: Upload ZIP to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/smappee_ev.zip
          fail_on_unmatched_files: true
